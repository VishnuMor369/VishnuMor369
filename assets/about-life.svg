<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="about-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <radialGradient id="about-glow-left" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="about-glow-right" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#070b16" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="about-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="about-prog-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>

    <pattern id="about-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.1"/>
    </pattern>

    <style>
      .about-font {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .about-mono {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace;
      }

      @keyframes aboutSlide1 {
        0% { opacity: 1; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(0); }
        33.3% { opacity: 0; transform: translateY(-8px); }
        96.6% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes aboutSlide2 {
        0%, 30% { opacity: 0; transform: translateY(8px); }
        33.3% { opacity: 1; transform: translateY(0); }
        63.3% { opacity: 1; transform: translateY(0); }
        66.6% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(8px); }
      }

      @keyframes aboutSlide3 {
        0%, 63.3% { opacity: 0; transform: translateY(8px); }
        66.6% { opacity: 1; transform: translateY(0); }
        96.6% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-8px); }
      }

      .about-slide-1 {
        animation: aboutSlide1 12s infinite;
        opacity: 1;
      }
      .about-slide-2 {
        animation: aboutSlide2 12s infinite;
        opacity: 0;
      }
      .about-slide-3 {
        animation: aboutSlide3 12s infinite;
        opacity: 0;
      }

      @keyframes aboutProg1 {
        0% { width: 0px; }
        33.3% { width: 110px; }
        98% { width: 110px; }
        100% { width: 0px; }
      }
      @keyframes aboutProg2 {
        0%, 33.3% { width: 0px; }
        66.6% { width: 110px; }
        98% { width: 110px; }
        100% { width: 0px; }
      }
      @keyframes aboutProg3 {
        0%, 66.6% { width: 0px; }
        100% { width: 110px; }
      }

      .about-bar-1 {
        animation: aboutProg1 12s linear infinite;
        width: 110px;
      }
      .about-bar-2 {
        animation: aboutProg2 12s linear infinite;
        width: 0px;
      }
      .about-bar-3 {
        animation: aboutProg3 12s linear infinite;
        width: 0px;
      }

      @media (prefers-reduced-motion: reduce) {
        .about-slide-1, .about-slide-2, .about-slide-3, .about-bar-1, .about-bar-2, .about-bar-3 {
          animation: none !important;
        }
        .about-slide-1 { opacity: 1 !important; transform: none !important; }
        .about-slide-2, .about-slide-3 { display: none !important; }
        .about-bar-1 { width: 110px !important; }
        .about-bar-2, .about-bar-3 { width: 0px !important; }
      }
    </style>
  </defs>

  <rect width="900" height="480" fill="url(#about-bg-grad)" rx="20"/>
  <rect width="900" height="480" fill="url(#about-glow-left)" rx="20"/>
  <rect width="900" height="480" fill="url(#about-glow-right)" rx="20"/>
  <rect width="900" height="480" fill="url(#about-dots)" rx="20"/>

  <rect x="1" y="1" width="898" height="478" rx="19" fill="none" stroke="url(#about-border-grad)" stroke-width="1.5"/>
  <rect x="8" y="8" width="884" height="464" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <g transform="translate(45, 42)">
    <text x="0" y="0" fill="#247bff" class="about-mono" font-size="11" font-weight="700" letter-spacing="1">// 01. CAPABILITIES &amp; PASSIONS</text>
    <text x="0" y="24" fill="#ffffff" class="about-font" font-size="22" font-weight="800" letter-spacing="-0.3">Engineering Capabilities &amp; Creative Pursuits</text>
  </g>

  <!-- Left Column: Capabilities -->
  <g transform="translate(45, 96)">
    <text x="0" y="0" fill="#94a3b8" class="about-mono" font-size="11" font-weight="600" letter-spacing="0.5">CORE TECHNICAL DISCIPLINES</text>

    <!-- Capability 1 -->
    <g transform="translate(0, 16)">
      <rect width="380" height="74" rx="12" fill="#0a1224" stroke="#247bff" stroke-width="1" stroke-opacity="0.3"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#0d1b38" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
      <path transform="translate(18, 18) scale(0.75)" stroke="#38bdf8" stroke-width="2" fill="none" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      <text x="58" y="26" fill="#f8fafc" class="about-font" font-size="13" font-weight="700">Full-Stack Architecture</text>
      <text x="58" y="44" fill="#38bdf8" class="about-mono" font-size="10.5" font-weight="600">Next.js • React Native • TypeScript • Tailwind</text>
      <text x="58" y="60" fill="#94a3b8" class="about-font" font-size="10.5">End-to-end scalable web &amp; mobile production systems.</text>
    </g>

    <!-- Capability 2 -->
    <g transform="translate(0, 98)">
      <rect width="380" height="74" rx="12" fill="#0a1224" stroke="#ff354f" stroke-width="1" stroke-opacity="0.3"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#240c14" stroke="#ff354f" stroke-width="1" stroke-opacity="0.5"/>
      <path transform="translate(18, 18) scale(0.75)" stroke="#ff354f" stroke-width="2" fill="none" d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      <text x="58" y="26" fill="#f8fafc" class="about-font" font-size="13" font-weight="700">AI &amp; Automation Engineering</text>
      <text x="58" y="44" fill="#fb7185" class="about-mono" font-size="10.5" font-weight="600">Intelligent Agents • Autonomous Workflows</text>
      <text x="58" y="60" fill="#94a3b8" class="about-font" font-size="10.5">Building smart tools, agentic flows &amp; LLM systems.</text>
    </g>

    <!-- Capability 3 -->
    <g transform="translate(0, 180)">
      <rect width="380" height="74" rx="12" fill="#0a1224" stroke="#247bff" stroke-width="1" stroke-opacity="0.3"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#0d1b38" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
      <path transform="translate(18, 18) scale(0.75)" stroke="#38bdf8" stroke-width="2" fill="none" d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
      <text x="58" y="26" fill="#f8fafc" class="about-font" font-size="13" font-weight="700">Cloud &amp; Scalable Backend</text>
      <text x="58" y="44" fill="#38bdf8" class="about-mono" font-size="10.5" font-weight="600">Java • Node.js • PostgreSQL • AWS • Supabase</text>
      <text x="58" y="60" fill="#94a3b8" class="about-font" font-size="10.5">Resilient APIs, relational modeling &amp; cloud scaling.</text>
    </g>

    <!-- Capability 4 -->
    <g transform="translate(0, 262)">
      <rect width="380" height="74" rx="12" fill="#0a1224" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#131b2e" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
      <path transform="translate(18, 18) scale(0.75)" stroke="#94a3b8" stroke-width="2" fill="none" d="M4 17l6-6-6-6M12 19h8"/>
      <text x="58" y="26" fill="#f8fafc" class="about-font" font-size="13" font-weight="700">DevOps &amp; Infrastructure</text>
      <text x="58" y="44" fill="#cbd5e1" class="about-mono" font-size="10.5" font-weight="600">Linux • Git &amp; GitHub • CI/CD • REST APIs</text>
      <text x="58" y="60" fill="#94a3b8" class="about-font" font-size="10.5">Automated release pipelines and resilient deploy ops.</text>
    </g>
  </g>

  <!-- Right Column: Interests Carousel -->
  <g transform="translate(460, 96)">
    <rect width="395" height="340" rx="16" fill="#091022" stroke="url(#about-border-grad)" stroke-width="1.2"/>
    <rect x="6" y="6" width="383" height="328" rx="12" fill="#060c18" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

    <g transform="translate(20, 22)">
      <text x="0" y="0" fill="#94a3b8" class="about-mono" font-size="10.5" font-weight="700" letter-spacing="1">INTERESTS &amp; PURSUITS // 4S CYCLE</text>
      
      <g transform="translate(0, 14)">
        <g transform="translate(0, 0)">
          <rect width="112" height="4" rx="2" fill="#1e293b"/>
          <rect width="0" height="4" rx="2" fill="url(#about-prog-fill)" class="about-bar-1"/>
          <text x="0" y="18" fill="#38bdf8" class="about-mono" font-size="9" font-weight="700">01 PROJECTS</text>
        </g>

        <g transform="translate(122, 0)">
          <rect width="112" height="4" rx="2" fill="#1e293b"/>
          <rect width="0" height="4" rx="2" fill="url(#about-prog-fill)" class="about-bar-2"/>
          <text x="0" y="18" fill="#38bdf8" class="about-mono" font-size="9" font-weight="700">02 AI &amp; AUTO</text>
        </g>

        <g transform="translate(244, 0)">
          <rect width="112" height="4" rx="2" fill="#1e293b"/>
          <rect width="0" height="4" rx="2" fill="url(#about-prog-fill)" class="about-bar-3"/>
          <text x="0" y="18" fill="#38bdf8" class="about-mono" font-size="9" font-weight="700">03 HACKATHONS</text>
        </g>
      </g>
    </g>

    <!-- Slide 1: Building side projects -->
    <g transform="translate(20, 80)" class="about-slide-1">
      <rect width="355" height="235" rx="12" fill="#0a1428" stroke="#247bff" stroke-width="1" stroke-opacity="0.3"/>
      
      <rect x="16" y="16" width="165" height="24" rx="6" fill="#0f224a" stroke="#247bff" stroke-width="1" stroke-opacity="0.5"/>
      <text x="26" y="32" fill="#38bdf8" class="about-mono" font-size="10" font-weight="700">★ 01 / CRAFT &amp; SHIP</text>
      
      <text x="16" y="68" fill="#ffffff" class="about-font" font-size="18" font-weight="800">Building Side Projects</text>
      <text x="16" y="88" fill="#93c5fd" class="about-mono" font-size="11" font-weight="600">Zero-to-One Architectural Execution</text>
      
      <text x="16" y="114" fill="#cbd5e1" class="about-font" font-size="12" font-weight="400">
        <tspan x="16" dy="0">Obsessed with turning bold ideas into production-ready software.</tspan>
        <tspan x="16" dy="18">Architected vehicle telematics in Fleetly, digital systems in</tspan>
        <tspan x="16" dy="18">Syncro Scale, and 3D WebGL configurators in KAAYA VERSE.</tspan>
      </text>

      <g transform="translate(16, 185)">
        <rect width="80" height="24" rx="6" fill="#070c18" stroke="#247bff" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="16" fill="#38bdf8" class="about-mono" font-size="9.5" font-weight="600">Fleetly</text>

        <rect x="88" width="110" height="24" rx="6" fill="#070c18" stroke="#247bff" stroke-width="1" stroke-opacity="0.4"/>
        <text x="100" y="16" fill="#38bdf8" class="about-mono" font-size="9.5" font-weight="600">Syncro Scale</text>

        <rect x="206" width="115" height="24" rx="6" fill="#070c18" stroke="#247bff" stroke-width="1" stroke-opacity="0.4"/>
        <text x="216" y="16" fill="#38bdf8" class="about-mono" font-size="9.5" font-weight="600">KAAYA VERSE</text>
      </g>
    </g>

    <!-- Slide 2: AI & Automation -->
    <g transform="translate(20, 80)" class="about-slide-2">
      <rect width="355" height="235" rx="12" fill="#0a1428" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
      
      <rect x="16" y="16" width="175" height="24" rx="6" fill="#08283d" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="26" y="32" fill="#38bdf8" class="about-mono" font-size="10" font-weight="700">⚡ 02 / ACCELERATION</text>
      
      <text x="16" y="68" fill="#ffffff" class="about-font" font-size="18" font-weight="800">AI &amp; Automation</text>
      <text x="16" y="88" fill="#38bdf8" class="about-mono" font-size="11" font-weight="600">Multiplier of Human Engineering Velocity</text>
      
      <text x="16" y="114" fill="#cbd5e1" class="about-font" font-size="12" font-weight="400">
        <tspan x="16" dy="0">Engineering intelligent agents, LLM pipelines, and automated</tspan>
        <tspan x="16" dy="18">workflows. Eliminating mechanical friction to let software</tspan>
        <tspan x="16" dy="18">engineers focus strictly on core problem-solving.</tspan>
      </text>

      <g transform="translate(16, 185)">
        <rect width="105" height="24" rx="6" fill="#070c18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="10" y="16" fill="#38bdf8" class="about-mono" font-size="9.5" font-weight="600">Agentic Workflows</text>

        <rect x="113" width="115" height="24" rx="6" fill="#070c18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="123" y="16" fill="#38bdf8" class="about-mono" font-size="9.5" font-weight="600">LLM Integrations</text>

        <rect x="236" width="85" height="24" rx="6" fill="#070c18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="246" y="16" fill="#38bdf8" class="about-mono" font-size="9.5" font-weight="600">Pipelines</text>
      </g>
    </g>

    <!-- Slide 3: Hackathons -->
    <g transform="translate(20, 80)" class="about-slide-3">
      <rect width="355" height="235" rx="12" fill="#0a1428" stroke="#ff354f" stroke-width="1" stroke-opacity="0.3"/>
      
      <rect x="16" y="16" width="165" height="24" rx="6" fill="#2b0d16" stroke="#ff354f" stroke-width="1" stroke-opacity="0.5"/>
      <text x="26" y="32" fill="#ff354f" class="about-mono" font-size="10" font-weight="700">🔥 03 / HIGH-PRESSURE</text>
      
      <text x="16" y="68" fill="#ffffff" class="about-font" font-size="18" font-weight="800">Hackathons &amp; Sprints</text>
      <text x="16" y="88" fill="#ff354f" class="about-mono" font-size="11" font-weight="600">Rapid Delivery Under Time Gates</text>
      
      <text x="16" y="114" fill="#cbd5e1" class="about-font" font-size="12" font-weight="400">
        <tspan x="16" dy="0">Thriving in 24–48 hour rapid engineering sprints. Uniting with</tspan>
        <tspan x="16" dy="18">cross-functional teammates to design, build, and deploy</tspan>
        <tspan x="16" dy="18">resilient software architectures under intense competitive focus.</tspan>
      </text>

      <g transform="translate(16, 185)">
        <rect width="90" height="24" rx="6" fill="#070c18" stroke="#ff354f" stroke-width="1" stroke-opacity="0.4"/>
        <text x="12" y="16" fill="#ff354f" class="about-mono" font-size="9.5" font-weight="600">24h-48h Sprints</text>

        <rect x="98" width="105" height="24" rx="6" fill="#070c18" stroke="#ff354f" stroke-width="1" stroke-opacity="0.4"/>
        <text x="108" y="16" fill="#ff354f" class="about-mono" font-size="9.5" font-weight="600">Team Synergy</text>

        <rect x="211" width="110" height="24" rx="6" fill="#070c18" stroke="#ff354f" stroke-width="1" stroke-opacity="0.4"/>
        <text x="221" y="16" fill="#ff354f" class="about-mono" font-size="9.5" font-weight="600">MVP Delivery</text>
      </g>
    </g>

  </g>

</svg>